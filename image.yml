# The manifest for docker-baseimage-debian. Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/image.schema.json
schema: 1
name: baseimage-debian
kind: base

summary: baseimage-debian container image.

upstream:
  version:
    type: os

release:
  branch: kali
  tag: kali
  channel: prerelease

build:
  base: ubuntu
  version_arg: OS
  platforms:
  - amd64
  - arm64
  first_party: false

test:
  startup_timeout: 30
  env:
    LSIO_FIRST_PARTY: 'true'

runtime: {}

docs:
  categories:
  - Uncategorized
  custom_readme: |
    [linuxserverurl]: https://linuxserver.io
    [forumurl]: https://forum.linuxserver.io
    [ircurl]: https://www.linuxserver.io/irc/
    [appurl]: https://github.com/debuerreotype/docker-debian-artifacts
    [dockerfileurl]: https://github.com/linuxserver/docker-baseimage-debian/blob/master/Dockerfile



    [![linuxserver.io](https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/linuxserver_medium.png?v=4&s=4000)][linuxserverurl]


